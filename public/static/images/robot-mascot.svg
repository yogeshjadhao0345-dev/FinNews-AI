<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <line x1="120" y1="45" x2="120" y2="25" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
  <circle cx="120" cy="22" r="10" fill="#38bdf8" />
  <circle cx="120" cy="22" r="15" fill="#38bdf8" opacity="0.3" />

  <!-- Robot Head / Body -->
  <rect x="50" y="45" width="140" height="110" rx="36" fill="url(#robotGrad)" />
  
  <!-- Ears / Headphones -->
  <rect x="36" y="75" width="14" height="45" rx="7" fill="#0369a1" />
  <rect x="190" y="75" width="14" height="45" rx="7" fill="#0369a1" />

  <!-- Face Screen -->
  <rect x="65" y="60" width="110" height="75" rx="22" fill="url(#screenGrad)" />

  <!-- Expressive Friendly Eyes -->
  <circle cx="92" cy="92" r="12" fill="#38bdf8" />
  <circle cx="95" cy="89" r="4" fill="#ffffff" />
  <circle cx="148" cy="92" r="12" fill="#38bdf8" />
  <circle cx="151" cy="89" r="4" fill="#ffffff" />

  <!-- Smile -->
  <path d="M 108 116 Q 120 126 132 116" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Cute Newspaper / Tablet in hands -->
  <rect x="65" y="145" width="110" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
  <rect x="75" y="155" width="40" height="8" rx="4" fill="#0284c7" />
  <line x1="75" y1="172" x2="165" y2="172" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <line x1="75" y1="184" x2="155" y2="184" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="75" y1="196" x2="140" y2="196" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Robot Hands holding the paper -->
  <ellipse cx="58" cy="180" rx="14" ry="10" fill="#0284c7" />
  <ellipse cx="182" cy="180" rx="14" ry="10" fill="#0284c7" />

  <!-- Sparkles / AI Magic -->
  <polygon points="195,30 200,40 210,45 200,50 195,60 190,50 180,45 190,40" fill="#facc15" />
  <polygon points="35,120 38,127 45,130 38,133 35,140 32,133 25,130 32,127" fill="#38bdf8" />
</svg>
